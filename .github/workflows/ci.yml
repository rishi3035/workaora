# Automatic checks. GitHub runs these on its own computers after every upload
# to "main", and for every pull request. A green tick means all passed; a red
# cross means something needs fixing.
#
# What runs: the same "npm run check" used on a developer's computer
# (formatting, lint, type-check, tests), then a production build.
#
# What does NOT run here: the database tests (npm run test:db). They need the
# development database's secret key, which is deliberately not stored on
# GitHub. Run them on your own computer before changing the database.
#
# No secrets are used by this workflow.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  # Lets the checks be started by hand from the Actions tab, on any branch.
  workflow_dispatch:

# If a newer upload arrives while checks are still running for an older one
# on the same branch, stop the older run. Saves free minutes.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# The workflow may only read the code. It cannot change the repository.
permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, tests and build
    runs-on: ubuntu-latest
    # A normal run takes a few minutes. Stop a stuck one before it wastes minutes.
    timeout-minutes: 15

    env:
      # Do not send anonymous usage statistics to the makers of Next.js.
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # Each action is pinned to an exact, reviewed version (the long code),
      # so it cannot be silently swapped for a different one.
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install packages exactly as recorded in package-lock.json
        run: npm ci --no-fund

      - name: Format, lint, type-check and tests
        run: npm run check

      - name: Production build
        run: npm run build
